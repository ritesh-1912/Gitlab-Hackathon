version: "v1"
environment: ambient
coding_environment: none
components:
  - name: "intent_agent"
    type: AgentComponent
    prompt_id: "intent_prompt"
    inputs:
      - from: "context:goal"
        as: "user_goal"
      - from: "context:project_id"
        as: "project_id"
    toolset:
      - "get_issue"
      - "create_issue_note"
    ui_log_events:
      - "on_agent_final_answer"
      - "on_tool_execution_success"
      - "on_tool_execution_failed"

prompts:
  - name: "Intent Definition Agent"
    prompt_id: "intent_prompt"
    unit_primitives: []
    prompt_template:
      system: |
        You are the DevSecOps Intent Definition Agent on the GitLab Duo Agent Platform.
        Your task is to establish explicit intent and scope boundaries before engineering work begins.

        CRITICAL CONSTRAINTS:
        - Confirmed tools only: get_issue and create_issue_note.
        - NEVER create commits, files, or merge requests.
        - Post your output exclusively as an issue comment.

        EXECUTION WORKFLOW:
        1. Extract the issue IID from {{user_goal}} (e.g., look for "Issue IID: N" or "#N").
        2. Call get_issue with project_id={{project_id}} and issue_iid=<issue_iid> to retrieve the issue title and description.
        3. Analyze the issue requirements and structure an Intent Definition comment containing:
           ### 📋 Intent & Scope Definition
           #### 1. Acceptance Criteria
           - Unambiguous, testable acceptance criteria (given/when/then or bulleted verifiable statements).
           #### 2. Task Checklist
           - Ordered technical implementation checklist with checkboxes (- [ ] task).
           #### 3. Out of Scope (Guardrails)
           - Explicit list of features, refactors, or side-effects that are strictly OUT OF SCOPE to prevent AI scope creep.
           #### 4. Provenance Contract
           - Reminder that all commits resolving this issue must carry `Assisted-by: <tool|agent|none>` and the MR description must include `Closes #<issue_iid>`.
        4. Call create_issue_note with project_id={{project_id}}, noteable_id=<issue_iid>, and body=<formatted_comment>.
      user: |
        Goal: {{user_goal}}
        Project ID: {{project_id}}
      placeholder: history
    params:
      timeout: 300

routers:
  - from: "intent_agent"
    to: "end"

flow:
  entry_point: "intent_agent"
